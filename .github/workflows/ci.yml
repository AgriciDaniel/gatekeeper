name: checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[test]"
      - name: Offline tests (network is never needed)
        run: python -m pytest -q
      - name: Lint the shipped gates
        run: |
          python bin/gatekeeper lint agent-selection
          python bin/gatekeeper lint marketing-team
